name: Add How To Play
on:
  push:
    paths:
      - '.github/workflows/add-how-to-play.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Vietnamese how-to-play screen
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/ui.js')
          s = p.read_text(encoding='utf-8')

          # Add menu tile once, immediately before Settings.
          guide_btn = '''        <button type="button" class="nav-item" data-a="guide"><span><h3>HƯỚNG DẪN CHƠI</h3><p>ERS, tăng tốc điện, các phím điều khiển và cách sử dụng</p></span></button>\n'''
          settings_marker = '        <button type="button" class="nav-item" data-a="settings"><span><h3>SETTINGS</h3><p>Difficulty, race distance, assists, audio, graphics</p></span></button>'
          if 'data-a="guide"' not in s:
              if settings_marker not in s:
                  raise SystemExit('Không tìm thấy nút Settings để chèn hướng dẫn')
              s = s.replace(settings_marker, guide_btn + settings_marker, 1)

          # Make the guide tile open an internal screen instead of sending an unknown menu action to main.js.
          old_click = """        if (a === 'champNew') this.cb('champNew');\n        else this.cb('menu', a);"""
          new_click = """        if (a === 'guide') this.showGuide();\n        else if (a === 'champNew') this.cb('champNew');\n        else this.cb('menu', a);"""
          if "if (a === 'guide') this.showGuide();" not in s:
              if old_click not in s:
                  raise SystemExit('Không tìm thấy bộ xử lý click menu')
              s = s.replace(old_click, new_click, 1)

          # Add a dedicated guide screen using the existing settings screen container.
          if 'showGuide() {' not in s:
              marker = '  // ============ TEAM SELECT ============'
              if marker not in s:
                  raise SystemExit('Không tìm thấy vị trí chèn showGuide')
              guide_method = r'''  // ============ HOW TO PLAY ============
  showGuide() {
    this.hideAll();
    const el = this.screens.settings;
    el.className = 'screen active menu-screen';
    el.innerHTML = `
      ${header('HƯỚNG DẪN <small>CHƠI</small>')}
      <div class="menu-body" style="overflow:auto;align-items:flex-start;padding-bottom:110px;">
        <div style="width:min(1050px,94vw);margin:0 auto;padding:18px 24px 30px;background:rgba(12,14,22,.94);border-left:4px solid #e10600;box-shadow:0 10px 35px rgba(0,0,0,.28);line-height:1.65;color:#e8e8ee;font-size:16px;">
          <h2 style="margin:0 0 12px;color:#fff;font-size:25px;">PIN ĐIỆN VÀ ERS</h2>
          <p><strong>Xe bạn có một cục pin điện giống như “bình năng lượng”.</strong><br>
          Khi bạn phanh hoặc nhả ga giảm tốc thì xe có thể <strong>nạp điện lại vào pin</strong>.<br>
          Khi bạn tăng tốc, xe có thể <strong>lấy điện từ pin ra để xe mạnh hơn</strong>.</p>
          <p style="font-size:18px;"><strong>ERS chính là cách bạn quyết định: lúc này nên ưu tiên “sạc pin” hay “xài pin”.</strong></p>
          <ul style="padding-left:24px;margin:8px 0 18px;">
            <li style="margin:9px 0;"><strong>ERS THU HỒI</strong> = <strong>chế độ sạc pin</strong>. Xe chạy yếu hơn một chút nhưng pin nạp lại nhanh hơn. Dùng khi pin gần hết hoặc đang ở đoạn mà bạn chưa cần vượt ai. Hiểu như điện thoại bật “tiết kiệm pin”.</li>
            <li style="margin:9px 0;"><strong>ERS CÂN BẰNG</strong> = <strong>chạy bình thường</strong>. Xe vừa dùng điện vừa thu hồi điện ở mức vừa phải. Bạn nên để chế độ này phần lớn thời gian khi mới chơi.</li>
            <li style="margin:9px 0;"><strong>ERS TẤN CÔNG</strong> = <strong>xài pin để xe mạnh hơn</strong>. Xe tăng tốc tốt hơn nhưng pin tụt nhanh. Dùng khi bạn muốn vượt xe trước, thoát cua nhanh hoặc không muốn xe sau vượt mình.</li>
            <li style="margin:9px 0;"><strong>Giữ SPACE</strong> = <strong>Turbo điện</strong>. Đây là mức tăng tốc mạnh hơn nữa. Bạn giữ SPACE thì xe lấy rất nhiều điện trong pin để tăng tốc mạnh trong vài giây. Pin sẽ tụt rất nhanh.</li>
          </ul>
          <div style="padding:12px 16px;margin:14px 0 24px;background:rgba(225,6,0,.14);border:1px solid rgba(225,6,0,.55);font-size:18px;font-weight:800;color:#fff;">
            THU HỒI = sạc pin → CÂN BẰNG = chạy thường → TẤN CÔNG = chạy mạnh → SPACE = tăng tốc cực mạnh.
          </div>
          <h2 style="margin:0 0 10px;color:#fff;font-size:25px;">CÁC PHÍM CHÍNH BẠN NÊN NHỚ</h2>
          <ul style="padding-left:24px;margin:8px 0 20px;">
            <li style="margin:8px 0;"><strong>W hoặc ↑</strong>: ga; <strong>S hoặc ↓</strong>: phanh/lùi; <strong>A/D hoặc ←/→</strong>: đánh lái.</li>
            <li style="margin:8px 0;"><strong>V</strong>: đổi ERS Thu hồi → Cân bằng → Tấn công; <strong>SPACE</strong>: Turbo điện / tăng tốc điện mạnh.</li>
            <li style="margin:8px 0;"><strong>Q / E</strong>: xuống số / lên số khi bạn chọn <strong>số sàn</strong>; để hộp số tự động thì không cần dùng.</li>
            <li style="margin:8px 0;"><strong>P</strong>: yêu cầu vào pit; khi vào pit sẽ chọn loại lốp.</li>
            <li style="margin:8px 0;"><strong>C</strong>: đổi 4 camera: bám đuôi → cockpit → T-Cam → đầu xe; <strong>B</strong>: đổi trang đồng hồ cockpit.</li>
            <li style="margin:8px 0;"><strong>N</strong>: bật/tắt tên tay đua trên xe AI; <strong>M</strong>: tắt/bật âm thanh; <strong>J</strong>: xuất Ghost Replay; <strong>ESC</strong>: tạm dừng.</li>
            <li style="margin:8px 0;"><strong>Enter</strong>: bắt đầu phiên/chặng khi xe đang chờ xuất phát.</li>
          </ul>
          <div class="btn-row" style="justify-content:flex-start;margin-top:22px;">
            <button type="button" class="f1-btn primary" id="btn-guide-back"><span>← QUAY LẠI MENU CHÍNH</span></button>
          </div>
        </div>
      </div>`;
    el.querySelector('#btn-guide-back').addEventListener('click', () => this.cb('back', 'main'));
    this._enter(el);
    this._setNavFocus(el, el.querySelector('#btn-guide-back'));
  }

'''
              s = s.replace(marker, guide_method + marker, 1)

          # Keep the requested footer promotion removed even if a prior file version is restored.
          s = s.replace("const TACN_FOOTER = `<span class=\"tacn-mark\">PRESENTED BY THE AI CONSULTING NETWORK — ${TACN_URL}</span>`;", "const TACN_FOOTER = '';", 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Thêm mục Hướng dẫn chơi tiếng Việt"
            git push
          fi